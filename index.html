<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenLab Portal</title><style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  height:100vh;
  overflow:hidden;
  background: linear-gradient(135deg,#2cc4a3,#167f8c);
}

/* CONTAINER */
.container{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
}

/* WHITE SIDE */
.white{
  width:40%;
  height:100%;
  position:absolute;
  left:0;
  top:0;
  background:white;

  display:flex;
  justify-content:center;
  align-items:center;

  transition:0.8s ease;
  z-index:2;
}

.white img{
  width:260px;
}

/* BLUE SIDE */
.blue{
  width:60%;
  height:100%;
  position:absolute;
  right:0;
  top:0;

  background: linear-gradient(135deg,#2cc4a3,#167f8c);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;

  transition:0.8s ease;
}

/* CURVE */
.blue::before{
  content:"";
  position:absolute;
  left:-120px;
  top:0;
  width:250px;
  height:100%;
  background:#2cc4a3;
  border-radius:0 120px 120px 0;
  transition:0.8s;
}

/* TEXT */
.title{
  font-size:30px;
  margin-bottom:10px;
}

.subtitle{
  margin-bottom:30px;
}

/* BUTTON */
.btn{
  padding:15px 45px;
  border:none;
  border-radius:30px;
  background:white;
  color:#167f8c;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.1);
}

/* SWITCH */
.switch{
  position:absolute;
  top:50%;
  left:-50px;
  transform:translateY(-50%);
  background:#1e5f74;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
  z-index:5;
}

/* ========================= */
/* 🔥 ACTIVE STATE (SWAP) */
/* ========================= */

/* WHITE → RIGHT */
.container.active .white{
  left:60%;
}

/* BLUE → LEFT */
.container.active .blue{
  right:40%;
}

/* CURVE FLIP */
.container.active .blue::before{
  left:auto;
  right:-120px;
  border-radius:120px 0 0 120px;
}

/* SWITCH MOVE */
.container.active .switch{
  left:auto;
  right:-50px;
}

</style></head><body><div class="container" id="container"> <!-- WHITE --> <div class="white">
    <img src="Green-Logo.png">
  </div> <!-- BLUE --> <div class="blue"><div class="switch" onclick="toggle()">Switch</div>

<h1 class="title" id="title">Welcome to GreenLab Clinic</h1>
<p class="subtitle" id="sub">& Wellness Hub</p>

<button class="btn" id="btn" onclick="go()">Create Form</button>

  </div></div><script>

let isLogin = false;

function toggle(){

  const container = document.getElementById("container");
  const title = document.getElementById("title");
  const sub = document.getElementById("sub");
  const btn = document.getElementById("btn");

  container.classList.toggle("active");

  isLogin = !isLogin;

  if(isLogin){
    title.innerText = "Welcome Back!";
    sub.innerText = "Login to your account";
    btn.innerText = "Login";
  }else{
    title.innerText = "Welcome to GreenLab Clinic";
    sub.innerText = "& Wellness Hub";
    btn.innerText = "Create Form";
  }
}

function go(){
  if(isLogin){
    window.location.href = "login.html";
  }else{
    window.location.href = "patient.html?form=true";
  }
}

</script></body>
</html>
