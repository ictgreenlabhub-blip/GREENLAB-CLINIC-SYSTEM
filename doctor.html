<!DOCTYPE html>
<html>
<head>
<title>Doctor Panel</title>

<link rel="stylesheet" href="css/sb-admin-2.min.css">
<link rel="stylesheet" href="custom.css">


</head>

<body>

<!-- HEADER -->
<div class="header">

  <!-- LEFT -->
  <div class="header-left">
    <h5 class="header-tittle">GreenLab Clinic & Wellness Hub</h5>
  </div>

  <!-- RIGHT -->
  <div class="header-right">

    <!-- NOTIFICATION -->
    <div class="notif">
      🔔
      <span class="notif-badge">3</span>
    </div>

    <!-- USER -->
    <div class="user-dropdown">

      <div class="user-info" onclick="toggleDropdown()">
        <img src="profile.png">
        <span class="username">Doctor</span>
      </div>

      <!-- DROPDOWN -->
      <div id="dropdownMenu" class="dropdown-menu">
        <a href="#">👤 Profile</a>
        <a href="#">⚙ Settings</a>
        <a href="#">🚪 Logout</a>
      </div>

    </div>

    <!-- MENU BUTTON -->
    <span class="menu-btn" onclick="toggleSidebar()">☰</span>

  </div>

</div>
<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

  <div class="logo-center">
    <img src="Greenlab-logo.png">
  </div>

  <div class="menu">
    
    <a href="doctor.html">👨‍⚕️ Doctor</a>
    
  </div>
</div>
<!-- MAIN -->
<div id="main" class="main">

  
  <div class="box">
    <div id="loading">⏳ Loading data...</div>
    <h3>Doctor Panel</h3>
    <div class="box-logo">
      <img src="Green-Logo.png">
    </div>
    <input type="text" id="searchInput" placeholder="🔍 Search patient..." 
    style="margin-bottom:10px; padding:8px; width:100%; 
    border-radius:8px; border:1px solid #ccc;">
    <table id="table"></table>
  </div>

</div>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyDfeecNJixHWBEasQhnxGj5Rv2fEbFrVSP-pYWtHFXIQ_u6z0P0kigrH4Y8zOawkp3kg/exec";

let patientData = [];

/* LOAD DATA */
fetch(API_URL)
.then(res=>res.json())
.then(data=>{

  patientData = data;

 
  let rows = data.slice(1);
let html = `
<tr>
  <th>Name</th>
  <th>Age</th>
  <th>Sex</th>
  <th>Weight</th>
  <th>Temp</th>
  <th>BP</th>
  <th>Schedule</th>
  <th>Meet</th>
  <th>PDF</th>
  <th>Send</th>
  <th>Action</th>
</tr>`;

let i = 0;

function renderChunk(){
  let chunk = 20; // 🔥 ilang rows per batch

  for(let c=0; c<chunk && i<rows.length; c++, i++){
    let r = rows[i];

    let schedule = r[12];
    let meet = r[13];

    let scheduleDisplay = "No Schedule";
    let scheduleClass = "schedule-none";

    if(schedule){
      let d = new Date(schedule);
      if(!isNaN(d)){
        scheduleDisplay = d.toLocaleString("en-PH");
        scheduleClass = "schedule-ok";
      }
    }

    html += `
    <tr>
      <td>${r[2]||""}</td>
      <td>${computeAge(r[4])}</td>
      <td>${r[6]||""}</td>
      <td>${r[9]||""}</td>
      <td>${r[10]||""}</td>
      <td>${r[11]||""}</td>

      <td class="${scheduleClass}">
        ${scheduleDisplay}
      </td>

      <td>
        ${meet ? `<a href="${meet}" target="_blank">Open</a>` : "-"}
      </td>

      <td>
        ${r[19] ? `<a href="${r[19]}" target="_blank">🧾 RX</a>` : "-"}<br>
        ${r[21] ? `<a href="${r[21]}" target="_blank">📄 MedCert</a>` : "-"}
      </td>

      <td>
        ${r[20] === "SENT"
          ? `<span style="color:green;font-weight:bold;">SENT</span>`
          : `<button onclick="sendAll(${i+1})">Send</button>`}
      </td>

      <td>
        <button onclick="openRX(${i+2})">🧾 RX</button><br><br>
        <button onclick="openMedCert(${i+1})">📄 MedCert</button>
      </td>

    </tr>`;
  }

  document.getElementById("table").innerHTML = html;

  if(i < rows.length){
    requestAnimationFrame(renderChunk); // 🔥 smooth next batch
  } else {
    document.getElementById("loading").style.display = "none";
    document.getElementById("table").style.display = "table";
  }
}

renderChunk();

});


/* NAV */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("main").classList.toggle("shift");
}

/* OPEN RX */
function openRX(row){
  window.location.href = "prescription.html?row=" + row;
}

/* OPEN MEDCERT */
function openMedCert(row){
  window.location.href = "medcert.html?row=" + row;
}

/* AGE */
function computeAge(bday){
  if(!bday) return "";
  let d=new Date(bday);
  if(isNaN(d)) return "";
  return new Date().getFullYear()-d.getFullYear();
}

/* SEND BOTH */
function sendAll(row){

  if(!confirm("Send RX + MedCert?")) return;

  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"sendAll",
      row:row
    })
  })
  .then(()=> {
    alert("✅ Sent!");
    location.reload();
  })
  .catch(()=>{
    alert("❌ Error");
  });
}

</script>
<script>
function toggleDropdown(){
  document.getElementById("dropdownMenu").classList.toggle("show");
}

// close kapag nag click outside
window.onclick = function(e){
  if(!e.target.closest(".user-dropdown")){
    document.getElementById("dropdownMenu").classList.remove("show");
  }
}
</script>
<script>
setTimeout(() => {
  const search = document.getElementById("searchInput");

  search.addEventListener("keyup", function(){
    let value = this.value.toLowerCase();
    let rows = document.querySelectorAll("#table tr");

    rows.forEach((row, index)=>{
      if(index === 0) return; // skip header

      row.style.display = row.innerText.toLowerCase().includes(value)
        ? ""
        : "none";
    });
  });

}, 1000); // wait 1 second para sure loaded
</script>

</body>
</html>
