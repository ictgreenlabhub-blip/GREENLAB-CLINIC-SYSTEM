<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secretary Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/sb-admin-2.min.css">
<link rel="stylesheet" href="custom.css">



</head>

<body>

<!-- HEADER -->
<div class="header">

  <!-- LEFT -->
  <div class="header-left">
    <h5 class="header-tittle">GreenLab Clinic & Wellness Hub</h5>
  </div>
  <!-- RIGHT -->
  <div class="header-right">

    <!-- NOTIFICATION -->
    <div class="notif">
      🔔
      <span class="notif-badge">3</span>
    </div>

    <!-- USER -->
    <div class="user-dropdown">

      <div class="user-info" onclick="toggleDropdown()">
        <img src="img/profile.png">
        <span class="username" id="username">Secretary</span>
      </div>

      <!-- DROPDOWN -->
      <div id="dropdownMenu" class="dropdown-menu">
        <a href="#">👤 Profile</a>
        <a href="#">⚙ Settings</a>
        <a href="#">🚪 Logout</a>
      </div>

    </div>

    <!-- MENU BUTTON -->
    <span class="menu-btn" onclick="toggleSidebar()">☰</span>

  </div>

</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

  <div class="logo-center">
    <img src="img/Greenlab-logo.png">
  </div>

  <div class="menu">
    <a href="#" onclick="showSection('today')">📅 Today Patients</a>
  </div>

</div>

<!-- MAIN -->
<div id="main" class="main">

 
  <div class="box">
    <h4>Secretary Panel</h4>
    <div class="box-logo">
      <img src="img/Green-Logo.png">
    </div>
    <button class="btn btn-secondary mb-2" onclick="loadData()">
      Refresh
    </button>
    <h4>🟢 Active</h4>
    <table class="custom-table">
      <input type="text" id="searchInput" placeholder="🔍 Search patient..." style="margin-bottom:10px; padding:8px; width:100%; border-radius:8px; border:1px solid #ccc;">
       <thead>
    <tr>
      <th>Email</th>
      <th>Name</th>
      <th>Age</th>
      <th>Schedule</th>
      <th>Meet</th>
      <th>Status</th>
      <th>Send</th>
    </tr>
  </thead>
  <tbody id="today-body"></tbody>
</table>

<h4 class="mt-4">📁 History</h4>
<table class="custom-table">
  <thead>
    <tr>
      <th>Email</th>
      <th>Name</th>
      <th>Age</th>
      <th>Schedule</th>
      <th>Meet</th>
      <th>Status</th>
      <th>Send</th>
    </tr>
  </thead>
  <tbody id="history-body"></tbody>
</table>

  
  </div>


<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzi9G2f4oowDhKRe5rpeLMs7Z8g8pYZudOlJzXAhMxHY4QV6mioMlvtuNdI6f3QbTN7uQ/exec";

let patientData = [];

// AGE
function computeAge(bday){
  if(!bday) return "";
  let birth = new Date(bday);
  let today = new Date();

  let age = today.getFullYear() - birth.getFullYear();
  let m = today.getMonth() - birth.getMonth();

  if(m < 0 || (m === 0 && today.getDate() < birth.getDate())){
    age--;
  }
  return age;
}

// ================= LOAD DATA =================
async function loadData(){

  const res = await fetch(API_URL);
  const data = await res.json();

  patientData = data;

  let today = new Date().toDateString();

  let todayHTML = "";
  let historyHTML = "";

  for(let i = data.length - 1; i >= 1; i--){

    let r = data[i];

    let email = r[1];
    let name = r[2];
    let birthday = r[4];
    let schedule = r[12];
    let meet = r[13];
    let status = r[14];

    let age = computeAge(birthday);
    let createdDate = r[0] ? new Date(r[0]).toDateString() : "";

    let rowHTML = `
    <tr>
      <td>${email}</td>
      <td>${name}</td>
      <td>${age}</td>

      <td>
        <input type="datetime-local"
        value="${schedule ? schedule.substring(0,16) : ""}"
        id="sched-${i}">
      </td>

      <td>
        ${meet ? `<a href="${meet}" target="_blank">Open</a>` : "-"}
      </td>

      <td>
        <select onchange="updateStatus(${i}, this.value)">
          <option value="PENDING" ${status !== "DONE" ? "selected" : ""}>Pending</option>
          <option value="DONE" ${status === "DONE" ? "selected" : ""}>Done</option>
        </select>
      </td>

      <td>
        ${
          status === "SENT"
          ? `<span class="badge bg-success">SENT</span>`
          : `
            <button class="btn btn-primary btn-sm" onclick="generateSchedule(${i})">Generate</button>
            <button class="btn btn-success btn-sm" onclick="sendEmail(${i})">Send</button>
          `
        }
      </td>
    </tr>
    `;

    // ✅ FINAL LOGIC
    if(createdDate === today && status !== "DONE"){
      todayHTML += rowHTML;
    } 
    else if(status === "DONE"){
      historyHTML += rowHTML;
    }
  }

  document.getElementById("today-body").innerHTML =
    todayHTML || "<tr><td colspan='7'>No today patients</td></tr>";

  document.getElementById("history-body").innerHTML =
    historyHTML || "<tr><td colspan='7'>No history</td></tr>";
}


// ================= GENERATE =================
async function generateSchedule(rowIndex){

  let sched = document.getElementById("sched-"+rowIndex).value;

  if(!sched){
    alert("Please select schedule");
    return;
  }

  let formData = new FormData();
  formData.append("action","setSchedule");
  formData.append("row", rowIndex+1);
  formData.append("schedule", sched);

  await fetch(API_URL,{
    method:"POST",
    body: formData
  });

  alert("✅ Generated!");
  loadData();
}


// ================= SEND EMAIL =================
async function sendEmail(rowIndex){

  let formData = new FormData();
  formData.append("action","sendEmail");
  formData.append("row", rowIndex+1);

  await fetch(API_URL,{
    method:"POST",
    body: formData
  });

  alert("📩 Email Sent!");
  loadData();
}


// ================= UPDATE STATUS =================
async function updateStatus(rowIndex, newStatus){

  let formData = new FormData();
  formData.append("action","updateStatus");
  formData.append("row", rowIndex+1);
  formData.append("status", newStatus);

  await fetch(API_URL,{
    method:"POST",
    body: formData
  });

  loadData();
}


// ================= UI =================
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("main").classList.toggle("shift");
}

function toggleDropdown(){
  document.getElementById("dropdownMenu").classList.toggle("show");
}

window.onclick = function(e){
  if(!e.target.closest(".user-dropdown")){
    document.getElementById("dropdownMenu").classList.remove("show");
  }
}


// ================= SEARCH =================
document.getElementById("searchInput")?.addEventListener("keyup", function(){
  let value = this.value.toLowerCase();
  let rows = document.querySelectorAll("tbody tr");

  rows.forEach(row=>{
    row.style.display = row.innerText.toLowerCase().includes(value) ? "" : "none";
  });
});


// ================= AUTO LOAD =================
loadData();


</script>
