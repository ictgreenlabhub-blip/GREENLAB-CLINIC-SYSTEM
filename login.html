<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenLab Clinic & Wellness Hub Login</title>

<link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
<link href="css/sb-admin-2.min.css" rel="stylesheet">

<style>

/* LEFT SIDE DESIGN */
.login-left{
  background: linear-gradient(135deg,#edf2f3,#ebeef1);
}

/* LOGO */
.logo-img{
  width:300px;
  animation: float 3s ease-in-out infinite;
}

/* FLOAT ANIMATION */
@keyframes float{
  0%{transform: translateY(0);}
  50%{transform: translateY(-10px);}
  100%{transform: translateY(0);}
}

/* INPUT EFFECT */
input:focus{
  border-color:#dae4e7;
  box-shadow:0 0 5px rgba(0,198,255,0.5);
}

/* BUTTON HOVER */
.btn{
  transition:0.3s;
}
.btn:hover{
  transform: scale(1.05);
}

/* CARD ANIMATION */
.card{
  animation: fadeIn 0.8s ease;
}
@keyframes fadeIn{
  from{opacity:0; transform: translateY(20px);}
  to{opacity:1; transform: translateY(0);}
}

</style>

</head>

<body class="bg-gradient-primary">

<div class="container">

<div class="row justify-content-center">
<div class="col-xl-10 col-lg-12 col-md-9">

<div class="card o-hidden border-0 shadow-lg my-5">
<div class="card-body p-0">

<div class="row">

<!-- ✅ LEFT SIDE (LOGO NA) -->
<div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center login-left">
  <img src="img/Green-logo.png" class="logo-img">
</div>

<!-- RIGHT SIDE -->
<div class="col-lg-6">
<div class="p-5">

<div class="text-center">
<h1 class="h4 text-gray-900 mb-4">GreenLab Login</h1>
</div>

<form class="user" onsubmit="loginUser(event)">

<div class="form-group">
<input type="email" class="form-control form-control-user"
id="email" placeholder="Enter Email..." required>
</div>

<div class="form-group">
<input type="password" class="form-control form-control-user"
id="password" placeholder="Password" required>
</div>

<button class="btn btn-success btn-user btn-block">
Login
</button>

<hr>

<button type="button" onclick="googleLogin()" class="btn btn-google btn-user btn-block">
<i class="fab fa-google fa-fw"></i> Login with Google
</button>

<button type="button" onclick="facebookLogin()" class="btn btn-facebook btn-user btn-block">
<i class="fab fa-facebook-f fa-fw"></i> Login with Facebook
</button>

</form>

<hr>

<p id="msg" style="text-align:center;color:red;"></p>

</div>
</div>

</div>
</div>
</div>
</div>

</div>
</div>
</div>

<script>

/* 🔥 SIMPLE LOGIN */
function loginUser(e){
  e.preventDefault();

  let email = document.getElementById("email").value.toLowerCase();
  let pass = document.getElementById("password").value;

  if(pass !== "1234"){
    document.getElementById("msg").innerText = "Wrong password";
    return;
  }

  localStorage.setItem("user", email);
  window.location.href = "patient.html";
}

/* GOOGLE LOGIN */
function googleLogin(){
  let email = prompt("Enter your Google email:");
  if(email){
    localStorage.setItem("user", email.toLowerCase());
    window.location.href = "patient.html";
  }
}

/* FACEBOOK LOGIN */
function facebookLogin(){
  let email = prompt("Enter your Facebook email:");
  if(email){
    localStorage.setItem("user", email.toLowerCase());
    window.location.href = "patient.html";
  }
}

</script>

</body>
</html>
