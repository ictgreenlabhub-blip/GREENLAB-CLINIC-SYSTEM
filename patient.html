<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GreenLab Patient Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="custom.css">

</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <h5 class="header-title">GreenLab Clinic & Wellness Hub</h5>
  </div>

  <div class="header-right">
    <div class="notif">🔔<span class="notif-badge">3</span></div>

    <div class="user-dropdown">
      <div class="user-info" onclick="toggleDropdown()">
        <img src="img/profile.png">
        <span class="username" id="username">Patient</span>
      </div>

      <div id="dropdownMenu" class="dropdown-menu">
        <a href="#">👤 Profile</a>
        <a href="#">⚙ Settings</a>
        <a href="#" onclick="logout()">🚪 Logout</a>
      </div>
    </div>

    <span class="menu-btn" onclick="toggleSidebar()">☰</span>
  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <div class="logo-center">
    <img src="img/Greenlab-logo.png">
  </div>

  <div class="menu">
    <a href="#" onclick="showSection('dashboard')">🏠 Dashboard</a>
    <a href="#" onclick="showSection('documents')">📄 Documents</a>
    <a href="#" onclick="showSection('schedule')">📅 Schedule</a>
    <a href="#" onclick="showSection('help')">❓ Help</a>
  </div>
</div>

<!-- MAIN -->
<div id="main" class="main">
    <div id="formBox" class="form-card fade-in">

  <h4 class="text-center mb-3">Patient Form</h4>

  <form id="form">
    <input name="name" class="form-control mb-2" placeholder="Full Name" required>
    <input name="email" class="form-control mb-2" placeholder="Email" required>
    <input name="phone" class="form-control mb-2" placeholder="Phone">
    <input name="address" class="form-control mb-2" placeholder="Address">
    <input name="birthday" type="date" class="form-control mb-2">

    <input name="procedure" class="form-control mb-2" placeholder="Procedure">
    <input name="weight" class="form-control mb-2" placeholder="Weight">
    <input name="temperature" class="form-control mb-2" placeholder="Temperature">
    <input name="bp" class="form-control mb-3" placeholder="BP">

    <button class="btn btn-success w-100">Submit</button>
  </form>

</div>



  <div class="box text-center">
    <div class="logo-center">
      <img src="Green-Logo.png"
    style="width:120px;margin-bottom:10px;">
  </div>
    <h3>Patient Panel</h3>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard"></div>

  <!-- DOCUMENTS -->
  <div id="documentsSection" style="display:none;" class="box">
    <h4>My Documents</h4>
  </div>

  <!-- SCHEDULE -->
  <div id="scheduleSection" style="display:none;" class="box">
    <h4>My Schedule</h4>
  </div>

  <!-- HELP -->
  <div id="helpSection" style="display:none;" class="box">
    <h4>Help</h4>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbz5in6YB4YtIle-CYIq1OwVrE8HUFVyE5jkrsgq1edlRU9geMmr2WEgxhrLPrlaMvtHyA/exec";

let patientData = [];
let user = localStorage.getItem("user");

if(user){
  document.getElementById("username").innerText = "Guest"
}else{
  document.getElementById("username").innerText = user;
}
const params = new URLSearchParams(window.location.search);

/* SHOW FORM MODE */
if(params.get("form") === "true"){
  document.addEventListener("DOMContentLoaded", ()=>{
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("formBox").style.display = "block";
  });
}

/* MAIN LOAD */
document.addEventListener("DOMContentLoaded", () => {

  document.getElementById("username").innerText = user && user !== "All" ? user :"Patient";

  document.getElementById("dashboard").innerHTML = "⏳ Loading...";

  /* SUBMIT FORM */
  let isSubmitting = false;

document.getElementById("form")?.addEventListener("submit", function(e){
  e.preventDefault();

  if(isSubmitting) return;
  isSubmitting = true;

  const btn = this.querySelector("button");
  btn.innerText = "⏳ Submitting...";
  btn.disabled = true;

  let formData = new FormData(this);

  // ✅ SET USER
  let email = formData.get("email");
  localStorage.setItem("user", email);
  user = email;

  fetch(API_URL,{

    method:"POST",
    body: formData
  })
  .then(()=>{

    this.reset();

    document.getElementById("formBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    document.getElementById("dashboard").innerHTML = "⏳ Loading...";

    return fetch(API_URL);
  })
  .then(res=>res.json())
  .then(data=>{
    patientData = data;

    // 🔥 reload gamit ang tamang email
    loadDashboard(user);

    // 🔥 update header name
    document.getElementById("username").innerText = user;

  })
  .catch(()=>{
    alert("❌ Failed to submit");
  })
  .finally(()=>{
    btn.innerText = "Submit";
    btn.disabled = false;
    isSubmitting = false;
  });



});

    fetch(API_URL,{
      method:"POST",
      body: formData
    })
    .then(()=>{
      alert("✅ Submitted!");
      this.reset();

      refreshDashboard(); // 🔥 reload agad
    })
    .catch(()=>{
      alert("❌ Failed to submit");
    });
  });

  /* LOAD DATA */
  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    patientData = data;
    loadDashboard(user);
  })
  .catch(()=>{
    document.getElementById("dashboard").innerHTML = "❌ Failed to load data";
  });



/* DASHBOARD */
function loadDashboard(email){

  let formatDateTime = d => d ? new Date(d).toLocaleString("en-PH") : "-";

  let activeHTML = `
  <h4>🟢 Active</h4>
  <div class="table-box">
  <table class="table table-bordered">
  <tr>
    <th>Date</th>
    <th>Email</th>
    <th>Name</th>
    <th>Procedure</th>
    <th>Weight</th>
    <th>Temp</th>
    <th>BP</th>
    <th>Schedule</th>
    <th>Meet</th>
    <th>PDF</th>
  </tr>`;

  let historyHTML = `
  <h4 class="mt-4">📁 History</h4>
  <div class="table-box">
  <table class="table table-bordered">
  <tr>
    <th>Date</th>
    <th>Email</th>
    <th>Name</th>
    <th>Procedure</th>
    <th>Weight</th>
    <th>Temp</th>
    <th>BP</th>
    <th>Schedule</th>
    <th>Meet</th>
    <th>PDF</th>
  </tr>`;

  patientData.forEach((r,i)=>{

    if(i===0) return;

    let rowEmail = (r[1]||"").toLowerCase().trim();

    // 🔥 show all if no login
    if(email !== "ALL" && rowEmail !== email) return;

    let rowHTML = `
    <tr>
      <td>${formatDateTime(r[0])}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td>${r[8]||"-"}</td>
      <td>${r[9]||"-"}</td>
      <td>${r[10]||"-"}</td>
      <td>${r[11]||"-"}</td>
      <td>${formatDateTime(r[12])}</td>
      <td>${r[13] ? `<a href="${r[13]}" target="_blank">Join</a>` : "-"}</td>
      <td>${r[19] ? `<a href="${r[19]}" target="_blank">View</a>` : "-"}</td>
    </tr>`;

    if(!r[13]){
      activeHTML += rowHTML;
    } else {
      historyHTML += rowHTML;
    }

  });

  activeHTML += "</table></div>";
  historyHTML += "</table></div>";

  document.getElementById("dashboard").innerHTML = activeHTML + historyHTML;
}

/* AUTO REFRESH */
function refreshDashboard(){
  fetch(API_URL)
  .then(res=>res.json())
  .then(data=>{
    if(JSON.stringify(data) !== JSON.stringify(patientData)){
      patientData = data;
      loadDashboard(user);
    }
  });
}

setInterval(refreshDashboard, 5000);

/* UI */
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("main").classList.toggle("shift");
}

function toggleDropdown(){
  document.getElementById("dropdownMenu").classList.toggle("show");
}

function logout(){
  localStorage.removeItem("user");
  location.reload();
}

function showSection(section){
  document.getElementById("dashboard").style.display = (section==="dashboard") ? "block" : "none";
  document.getElementById("documentsSection").style.display = (section==="documents") ? "block" : "none";
  document.getElementById("scheduleSection").style.display = (section==="schedule") ? "block" : "none";
  document.getElementById("helpSection").style.display = (section==="help") ? "block" : "none";
}

</script>

</body>
</html>
